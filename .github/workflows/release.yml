name: release

# A tag v1.2.3 on main publishes ghcr.io/jbp-capital/portfolio-viewer-{web,worker} as 1.2.3, 1.2 and
# latest for amd64 and arm64, then a GitHub release with generated notes. A pre-release tag such as
# v1.2.3-rc.1 publishes only its own version and never becomes latest.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is on main and matches the app version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./apps/web/package.json').version")" = "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jbp-capital/portfolio-viewer-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release drafted by hand on GitHub already exists; then only the images are new.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "Portfolio Viewer ${GITHUB_REF_NAME#v}" "${flags[@]}"
