name: portfolio-viewer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portfolio
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: while the image sets up a new database, a temporary server answers on the
      # socket only, and nothing may start or restore into it yet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/portfolio
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${EMAIL_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-}
      GOTRUE_SMTP_SENDER_NAME: Portfolio Viewer
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    # Published image; `docker compose up -d --build` builds it from this repository instead.
    image: ${WEB_IMAGE:-ghcr.io/jbp-capital/portfolio-viewer-web:${PORTFOLIO_VIEWER_VERSION:-latest}}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/portfolio
      PUBLIC_URL: ${PUBLIC_URL}
      AUTH_URL: http://127.0.0.1:3000
      AUTH_PROXY_TARGET: http://auth:9999
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ALLOW_SIGNUP: "true"
      RUN_MIGRATIONS: "true"
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/JBP-Capital/portfolio-viewer}

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/jbp-capital/portfolio-viewer-worker:${PORTFOLIO_VIEWER_VERSION:-latest}}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/portfolio
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      QUOTE_INTERVAL_MINUTES: ${QUOTE_INTERVAL_MINUTES:-5}

volumes:
  db-data:
